<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>碑帖智能体</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        [v-cloak] {
            display: none !important;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Serif SC", "STSong", "SimSun", serif;
            overflow: hidden;
            background: #ffffff;
        }

        #app {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: transparent;
        }

        .splash-wrap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background: transparent;
            overflow: hidden;
            opacity: 1;
            pointer-events: auto;
            transition: opacity 0.5s ease;
        }

        .splash-wrap.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .scroll-left,
        .scroll-right {
            position: fixed;
            top: 0;
            width: 50vw;
            height: 100vh;
            pointer-events: none;
            transform: translateX(0);
        }

        .scroll-left { left: 0; }
        .scroll-right { right: 0; }

        .scroll-left.unroll {
            animation: moveLeft 1.8s cubic-bezier(0.42, 0.0, 0.58, 1.0) forwards;
        }
        .scroll-right.unroll {
            animation: moveRight 1.8s cubic-bezier(0.42, 0.0, 0.58, 1.0) forwards;
        }

        @keyframes moveLeft { to { transform: translateX(-100%); } }
        @keyframes moveRight { to { transform: translateX(100%); } }

        .scroll-face {
            position: absolute;
            top: -40px;
            height: calc(100% + 80px);
            width: 100%;
        }

        .scroll-left .scroll-face {
            left: 0;
            right: 36px;
            background-image: url("./public/image1.jpg");
            background-size: cover;
            background-position: left center;
            background-repeat: no-repeat;
        }

        .scroll-right .scroll-face {
            right: 0;
            left: 36px;
            background-image: url("./public/image2.jpg");
            background-size: cover;
            background-position: right center;
            background-repeat: no-repeat;
        }

        .scroll-text {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 700;
            font-size: clamp(1.8rem, 3.2vw, 2.6rem);
            color: #f0e6d2;
            letter-spacing: 0.2em;
            writing-mode: vertical-rl;
            text-orientation: upright;
            text-shadow: 2px 2px 8px rgba(40, 25, 10, 0.7);
        }

        .scroll-left .scroll-text { right: 100px; }
        .scroll-right .scroll-text { left: 100px; }

        .scroll-rod {
            position: absolute;
            top: 1%;
            width: 36px;
            height: 98%;
            border-radius: 18px;
            background: linear-gradient(to right, #5a3a18 0%, #8b6530 10%, #b8864a 25%, #d4a56a 48%, #e0b87c 52%, #b8864a 75%, #8b6530 90%, #5a3a18 100%);
        }

        .scroll-left .scroll-rod { right: 0; }
        .scroll-right .scroll-rod { left: 0; }

        .rod-cap {
            position: absolute;
            width: 40px;
            height: 20px;
            border-radius: 10px;
            background: radial-gradient(ellipse at 50% 45%, #e8c98a 0%, #b8864a 35%, #7a5525 75%, #4a3010 100%);
        }

        .scroll-left .rod-cap { right: 0; }
        .scroll-right .rod-cap { left: 0; }
        .rod-cap.top { top: 1%; transform: translateY(-10px); }
        .rod-cap.bottom { bottom: 1%; transform: translateY(10px); }

        .scroll-glow {
            position: fixed;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 84%;
            background: linear-gradient(180deg, transparent, rgba(240, 210, 150, 0.7), transparent);
            opacity: 0;
        }

        .scroll-glow.show {
            animation: glowFade 1.2s 0.1s ease-out forwards;
        }

        @keyframes glowFade {
            25% { opacity: 0.8; width: 4px; }
            100% { opacity: 0; width: 0; }
        }

        .seal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            z-index: 25;
            pointer-events: none;
        }

        .seal-stamp {
            width: 160px; height: 160px;
            position: relative;
            cursor: pointer;
            transition: transform 0.15s ease;
            box-shadow: 0 8px 24px rgba(60, 30, 15, 0.3);
            pointer-events: auto;
        }

        .seal-stamp.stamping {
            animation: stampDown 0.4s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        }

        @keyframes stampDown {
            40% { transform: translateY(12px) scale(0.9); }
            100% { transform: translateY(0) scale(1); }
        }

        .seal-border {
            position: absolute;
            width: 100%; height: 100%;
            border: 7px solid #a83226;
            background: rgba(168, 50, 38, 0.1);
        }

        .seal-text-grid {
            position: absolute;
            inset: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            direction: rtl;
            align-items: center;
            justify-items: center;
        }

        .seal-char {
            font-size: 48px;
            font-weight: bold;
            color: #a83226;
            line-height: 1;
        }

        .seal-hint {
            position: absolute;
            bottom: -34px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            color: #553e28;
            white-space: nowrap;
        }

        /* 菜单部分 */
        .strip-container {
            display: flex;
            width: 100%; height: 100%;
            position: relative;
            background: transparent;
        }

        .strip {
            position: relative;
            height: 100%;
            overflow: hidden;
            cursor: pointer;
            transition: flex 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .strip-left { flex: 1; }
        .strip-right { flex: 0 0 220px; min-width: 220px; transition: none !important; cursor: default; }
        .strip-left:hover { flex: 1.6; }
        .strip-container.has-hover .strip-left:not(:hover) { flex: 0.7; }

        .strip-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        .strip:nth-child(1) .strip-bg { background: linear-gradient(to bottom, #b72828 0%, #c83c3c 18%, #d86b6b 38%, #e8a8a8 58%, #f5d8d8 78%, #fff0f0 100%); }
        .strip:nth-child(2) .strip-bg { background: linear-gradient(to bottom, #b56a18 0%, #cc8022 18%, #e09948 38%, #f2c178 58%, #f9ddb8 78%, #fff5e8 100%); }
        .strip:nth-child(3) .strip-bg { background: linear-gradient(to bottom, #25406e 0%, #355988 18%, #4f77aa 38%, #789fcc 58%, #b4d0e8 78%, #e8f4ff 100%); }
        .strip:nth-child(4) .strip-bg { background: linear-gradient(to bottom, #185a48 0%, #24755e 18%, #389078 38%, #62b89c 58%, #a8ddc8 78%, #e4f7f0 100%); }
        .strip:nth-child(5) .strip-bg { background: linear-gradient(to bottom, #6b2e88 0%, #8242a5 18%, #9c5cbf 38%, #b988d8 58%, #d8b8e8 78%, #f0e0f8 100%); }

        .strip-top-texture {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 140px;
            z-index: 2;
            opacity: 0.18;
            background-size: cover;
            background-position: center;
        }

        .strip-bottom-image {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 260px;
            z-index: 2;
            background-size: cover;
            background-position: center bottom;
            opacity: 0.85;
            mix-blend-mode: multiply;
            transition: opacity 0.45s ease, transform 0.45s ease;
            transform-origin: center bottom;
            will-change: transform, opacity;
        }

        .strip:hover .strip-bottom-image { opacity: 0; transform: scale(1.06); }
        .strip:nth-child(1) .strip-bottom-image { background-position: center 50%; }
        .strip:nth-child(2) .strip-bottom-image { background-position: center 50%; }
        .strip:nth-child(3) .strip-bottom-image { background-position: center 30%; }
        .strip:nth-child(4) .strip-bottom-image { background-position: center 50%; }
        .strip:nth-child(5) .strip-bottom-image { background-position: center 20%; }

        .strip-fade-image {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 3;
            opacity: 0;
            transition: opacity 0.6s ease;
            background-size: cover;
            background-position: center;
            mix-blend-mode: normal;
        }

        .strip:hover .strip-fade-image { opacity: 0.88; }
        .no-fade .strip-fade-image { display: none !important; }
        .no-fade:hover .strip-bottom-image { opacity: 0.85 !important; transform: none !important; }

        @keyframes scaleBreathe {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.08); }
            100% { transform: translateX(-50%) scale(1); }
        }

        .strip-enter-tip {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%) scale(1);
            z-index: 4;
            font-size: 22px;
            letter-spacing: 8px;
            color: rgba(255, 255, 255, 0.92);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
            opacity: 0;
            transition: opacity 0.5s ease;
            white-space: nowrap;
            pointer-events: none;
        }

        .strip:hover .strip-enter-tip { opacity: 1; animation: scaleBreathe 1.4s infinite ease-in-out; }

        .strip-link {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
        }

        @keyframes spinFlower {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .flower-icon {
            width: 44px; height: 44px;
            margin-bottom: 24px;
            position: relative;
            z-index: 6;
            transition: all 0.35s ease;
            transform: rotate(0deg);
            filter: none;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .flower-icon svg { width: 100%; height: 100%; display: block; }
        .flower-icon path {
            fill: none;
            stroke: #ffffff;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: fill 0.35s ease, stroke 0.35s ease;
        }

        .strip:hover .flower-icon path { fill: rgba(255, 255, 255, 0.25); stroke: #ffffff; }
        .strip:hover .flower-icon {
            animation: spinFlower 1.4s linear infinite;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.85)) drop-shadow(0 0 16px rgba(255, 255, 255, 0.55));
        }

        /* 左侧菜单内容上移 */
        .strip-left .strip-content {
            justify-content: flex-start;
            padding-top: 8vh;
        }

        .strip-right .strip-content {
            justify-content: flex-start;
            padding-top: 10vh;
        }

        .strip-content {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            width: 100%;
            text-align: center;
        }

        .strip-title {
            font-size: 32px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.96);
            letter-spacing: 10px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
            transition: all 0.4s ease;
            font-family: "Noto Serif SC", "STSong", "SimSun", serif;
        }

        .strip:hover .strip-title { letter-spacing: 14px; text-shadow: 0 3px 10px rgba(0, 0, 0, 0.5); }
        .strip-subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 4px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
            transition: all 0.4s ease;
            font-weight: 400;
        }

        .strip:hover .strip-subtitle { color: rgba(255, 255, 255, 1); letter-spacing: 6px; }
        .strip-divider {
            width: 2px;
            height: 70px;
            background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.5), transparent);
            margin: 24px 0;
        }

        .right-wrap {
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 0;
            padding-top: 10vh;
        }

        .right-header-title {
            font-size: 28px;
            color: #ffffff;
            letter-spacing: 8px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
            margin-bottom: 18vh;
        }

        .right-two-col-box { display: flex; gap: 38px; }
        .right-col-text {
            font-size: 34px;
            color: rgba(255, 255, 255, 0.96);
            letter-spacing: 12px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        }

        @media (max-width: 768px) {
            .scroll-left .scroll-text { right: 50px; }
            .scroll-right .scroll-text { left: 50px; }
            .scroll-text { font-size: clamp(1.3rem, 2.8vw, 1.8rem); }
            .seal-stamp { width: 120px; height: 120px; }
            .seal-char { font-size: 36px; }
            .seal-border { border-width: 5px; }
            .strip-right { flex: 0 0 140px; min-width: 140px; }
            .strip-left .strip-content { padding-top: 6vh; }
            .strip-right .strip-content { padding-top: 8vh; }
            .strip-title { font-size: 24px; letter-spacing: 6px; }
            .strip-subtitle { font-size: 13px; }
            .flower-icon { width: 34px; height: 34px; margin-bottom: 18px; }
            .strip-enter-tip { font-size: 18px; bottom: 35px; }
            .right-header-title { font-size: 22px; letter-spacing: 5px; margin-bottom: 14vh; }
            .right-col-text { font-size: 26px; letter-spacing: 8px; }
            .right-two-col-box { gap: 18px; }
        }

        @media (max-width: 480px) {
            .scroll-left .scroll-text { right: 32px; }
            .scroll-right .scroll-text { left: 32px; }
            .scroll-text { font-size: 1rem; }
            .seal-stamp { width: 100px; height: 100px; }
            .seal-char { font-size: 28px; }
            .seal-border { border-width: 4px; }
            .seal-hint { font-size: 0.7rem; bottom: -26px; }
            .strip-right { flex: 0 0 100px; min-width: 100px; }
            .strip-left .strip-content { padding-top: 5vh; }
            .strip-right .strip-content { padding-top: 6vh; }
            .strip-title { font-size: 20px; letter-spacing: 4px; }
            .strip-subtitle { font-size: 11px; }
            .flower-icon { width: 28px; height: 28px; margin-bottom: 14px; }
            .strip-enter-tip { font-size: 14px; bottom: 24px; letter-spacing: 4px; }
            .right-header-title { font-size: 18px; letter-spacing: 3px; margin-bottom: 10vh; }
            .right-col-text { font-size: 20px; letter-spacing: 4px; }
            .right-two-col-box { gap: 10px; }
        }
    </style>
</head>
<body>
    <div id="app" v-cloak>
        <div class="strip-container" :class="{ 'has-hover': hoveredIndex !== null && hoveredIndex < 4 }">
            <div class="strip strip-left" @mouseenter="handleMouseEnter(0)" @mouseleave="handleMouseLeave">
                <div class="strip-bg"></div>
                <div class="strip-top-texture" :style="{ backgroundImage: `url(${textures[0]})` }"></div>
                <div class="strip-bottom-image" :style="{ backgroundImage: `url(${bottomImages[0]})` }"></div>
                <div class="strip-fade-image" :style="{ backgroundImage: `url(${fadeImages[0]})` }"></div>
                <div class="strip-content">
                    <div class="flower-icon">
                        <svg viewBox="0 0 48 48">
                            <g>
                                <path d="M24,24 C24,12 15,10 14,16 C13,22 18,24 24,24" />
                                <path d="M24,24 C36,24 38,15 32,14 C26,13 24,18 24,24" />
                                <path d="M24,24 C24,36 15,38 14,32 C13,26 18,24 24,24" />
                                <path d="M24,24 C12,24 10,33 16,34 C22,35 24,30 24,24" />
                                <path d="M24,24 C18,30 14,36 18,40 C22,44 28,38 24,24" />
                                <path d="M24,24 C30,18 36,14 40,18 C44,22 38,28 24,24" />
                                <circle cx="24" cy="24" r="2.5" fill="#ffffff" stroke="none" opacity="0.9"/>
                            </g>
                        </svg>
                    </div>
                    <div class="strip-title">核心简介</div>
                    <div class="strip-divider"></div>
                    <div class="strip-subtitle">洞悉底蕴</div>
                </div>
                <div class="strip-enter-tip">点击进入</div>
                <a class="strip-link" :href="links[0]"></a>
            </div>

            <div class="strip strip-left" @mouseenter="handleMouseEnter(1)" @mouseleave="handleMouseLeave">
                <div class="strip-bg"></div>
                <div class="strip-top-texture" :style="{ backgroundImage: `url(${textures[1]})` }"></div>
                <div class="strip-bottom-image" :style="{ backgroundImage: `url(${bottomImages[1]})` }"></div>
                <div class="strip-fade-image" :style="{ backgroundImage: `url(${fadeImages[1]})` }"></div>
                <div class="strip-content">
                    <div class="flower-icon">
                        <svg viewBox="0 0 48 48">
                            <g>
                                <path d="M24,24 C24,12 15,10 14,16 C13,22 18,24 24,24" />
                                <path d="M24,24 C36,24 38,15 32,14 C26,13 24,18 24,24" />
                                <path d="M24,24 C24,36 15,38 14,32 C13,26 18,24 24,24" />
                                <path d="M24,24 C12,24 10,33 16,34 C22,35 24,30 24,24" />
                                <path d="M24,24 C18,30 14,36 18,40 C22,44 28,38 24,24" />
                                <path d="M24,24 C30,18 36,14 40,18 C44,22 38,28 24,24" />
                                <circle cx="24" cy="24" r="2.5" fill="#ffffff" stroke="none" opacity="0.9"/>
                            </g>
                        </svg>
                    </div>
                    <div class="strip-title">智者答疑</div>
                    <div class="strip-divider"></div>
                    <div class="strip-subtitle">拨云见日</div>
                </div>
                <div class="strip-enter-tip">点击进入</div>
                <a class="strip-link" :href="links[1]"></a>
            </div>

            <div class="strip strip-left" @mouseenter="handleMouseEnter(2)" @mouseleave="handleMouseLeave">
                <div class="strip-bg"></div>
                <div class="strip-top-texture" :style="{ backgroundImage: `url(${textures[2]})` }"></div>
                <div class="strip-bottom-image" :style="{ backgroundImage: `url(${bottomImages[2]})` }"></div>
                <div class="strip-fade-image" :style="{ backgroundImage: `url(${fadeImages[2]})` }"></div>
                <div class="strip-content">
                    <div class="flower-icon">
                        <svg viewBox="0 0 48 48">
                            <g>
                                <path d="M24,24 C24,12 15,10 14,16 C13,22 18,24 24,24" />
                                <path d="M24,24 C36,24 38,15 32,14 C26,13 24,18 24,24" />
                                <path d="M24,24 C24,36 15,38 14,32 C13,26 18,24 24,24" />
                                <path d="M24,24 C12,24 10,33 16,34 C22,35 24,30 24,24" />
                                <path d="M24,24 C18,30 14,36 18,40 C22,44 28,38 24,24" />
                                <path d="M24,24 C30,18 36,14 40,18 C44,22 38,28 24,24" />
                                <circle cx="24" cy="24" r="2.5" fill="#ffffff" stroke="none" opacity="0.9"/>
                            </g>
                        </svg>
                    </div>
                    <div class="strip-title">翰墨临摹</div>
                    <div class="strip-divider"></div>
                    <div class="strip-subtitle">临池学书</div>
                </div>
                <div class="strip-enter-tip">点击进入</div>
                <a class="strip-link" :href="links[2]"></a>
            </div>

            <div class="strip strip-left" @mouseenter="handleMouseEnter(3)" @mouseleave="handleMouseLeave">
                <div class="strip-bg"></div>
                <div class="strip-top-texture" :style="{ backgroundImage: `url(${textures[3]})` }"></div>
                <div class="strip-bottom-image" :style="{ backgroundImage: `url(${bottomImages[3]})` }"></div>
                <div class="strip-fade-image" :style="{ backgroundImage: `url(${fadeImages[3]})` }"></div>
                <div class="strip-content">
                    <div class="flower-icon">
                        <svg viewBox="0 0 48 48">
                            <g>
                                <path d="M24,24 C24,12 15,10 14,16 C13,22 18,24 24,24" />
                                <path d="M24,24 C36,24 38,15 32,14 C26,13 24,18 24,24" />
                                <path d="M24,24 C24,36 15,38 14,32 C13,26 18,24 24,24" />
                                <path d="M24,24 C12,24 10,33 16,34 C22,35 24,30 24,24" />
                                <path d="M24,24 C18,30 14,36 18,40 C22,44 28,38 24,24" />
                                <path d="M24,24 C30,18 36,14 40,18 C44,22 38,28 24,24" />
                                <circle cx="24" cy="24" r="2.5" fill="#ffffff" stroke="none" opacity="0.9"/>
                            </g>
                        </svg>
                    </div>
                    <div class="strip-title">敬请期待</div>
                    <div class="strip-divider"></div>
                    <div class="strip-subtitle">静候佳音</div>
                </div>
                <div class="strip-enter-tip">点击进入</div>
                <a class="strip-link" :href="links[3]"></a>
            </div>

            <div class="strip strip-right no-fade">
                <div class="strip-bg"></div>
                <div class="strip-top-texture" :style="{ backgroundImage: `url(${textures[4]})` }"></div>
                <div class="strip-bottom-image" :style="{ backgroundImage: `url(${bottomImages[4]})` }"></div>
                <div class="strip-fade-image" :style="{ backgroundImage: `url(${fadeImages[4]})` }"></div>
                <div class="strip-content right-wrap">
                    <div class="right-header-title">碑帖智能体</div>
                    <div class="right-two-col-box">
                        <div class="right-col-text">请选择</div>
                        <div class="right-col-text">功能</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 开屏遮罩 -->
        <div class="splash-wrap" :class="{ 'fade-out': !showSplash }">
            <div :class="['scroll-left', { unroll: scrollOpen }]">
                <div class="scroll-face">
                    <div class="scroll-text">上图·智问</div>
                </div>
                <div class="scroll-rod"></div>
                <div class="rod-cap top"></div>
                <div class="rod-cap bottom"></div>
            </div>
            <div :class="['scroll-right', { unroll: scrollOpen }]">
                <div class="scroll-face">
                    <div class="scroll-text">典籍智能体</div>
                </div>
                <div class="scroll-rod"></div>
                <div class="rod-cap top"></div>
                <div class="rod-cap bottom"></div>
            </div>
            <div :class="['scroll-glow', { show: glowShow }]"></div>

            <div class="seal-overlay" v-show="sealShow" :style="{opacity: sealOpacity}">
                <div :class="['seal-stamp', { stamping: stampDown }]" @click="openBook">
                    <div class="seal-border"></div>
                    <div class="seal-text-grid">
                        <span class="seal-char">博</span>
                        <span class="seal-char">通</span>
                        <span class="seal-char">古</span>
                        <span class="seal-char">今</span>
                    </div>
                    <div class="seal-hint">· 轻触开卷 ·</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.min.js"></script>
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>
    <script>
        new Vue({
            el: '#app',
            data() {
                return {
                    showSplash: true,
                    scrollOpen: false,
                    glowShow: false,
                    sealShow: true,
                    sealOpacity: 1,
                    stampDown: false,
                    hoveredIndex: null,
                    textures: ['', '', '', '', ''],
                    bottomImages: [
                        "images/梅花.png",
                        "images/菊花.png",
                        "images/白玉兰.png",
                        "images/竹亭.png",
                        "images/荷花.png"
                    ],
                    fadeImages: [
                        "images/红.png",
                        "images/橙.png",
                        "images/蓝.png",
                        "images/绿.png",
                        "images/红.png"
                    ],
                    links: ["#", "#", "#", "#"]
                };
            },
            methods: {
                openBook() {
                    if (this.stampDown) return;
                    this.stampDown = true;
                    setTimeout(() => {
                        this.scrollOpen = true;
                        this.glowShow = true;
                        this.sealOpacity = 0;
                        setTimeout(() => {
                            this.sealShow = false;
                            setTimeout(() => {
                                this.showSplash = false;
                            }, 150);
                        }, 2000);
                    }, 500);
                },
                handleMouseEnter(index) {
                    this.hoveredIndex = index;
                },
                handleMouseLeave() {
                    this.hoveredIndex = null;
                }
            }
        });
    </script>
</body>
</html>
